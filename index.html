<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whinsy</title><link rel="icon" href="logo.png"><meta name="theme-color" content="#0a0e18">
<meta property="og:title" content="Whinsy"><meta property="og:image" content="https://whinsy.com.tr/logo.png">
<style>
*{box-sizing:border-box;margin:0}body{font-family:Inter,"Segoe UI",Roboto,sans-serif;background:#0a0e18;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.arka{position:fixed;inset:0;background:radial-gradient(800px 500px at 50% -10%,rgba(59,130,246,.22),transparent 70%);pointer-events:none}
.ust{position:relative;z-index:2;display:flex;gap:6px;margin-top:22px;padding:5px;border-radius:99px;background:rgba(15,21,36,.8);border:1px solid #1a2438}.ust a{color:#9aa6c2;text-decoration:none;font-size:14px;font-weight:600;padding:8px 16px;border-radius:99px}.ust a.secili{background:#1a2438;color:#fff}.ust a:hover{color:#fff}
main{position:relative;width:100%;max-width:560px;padding:40px 22px 30px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:112px;height:112px;object-fit:contain;margin-bottom:22px;filter:drop-shadow(0 8px 30px rgba(59,130,246,.35))}
h1{font-size:40px;font-weight:800;letter-spacing:-.5px}
.alt{color:#9aa6c2;margin-top:8px;font-size:16px;line-height:1.55}
.canli{margin-top:20px;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;
background:rgba(148,163,184,.08);border:1px solid #1e2a42;color:#9aa6c2;text-decoration:none;max-width:100%}
.canli span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canli i{flex:none;width:9px;height:9px;border-radius:50%;background:#64748b}
.canli.acik{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#fff}
.canli.acik i{background:#ef4444;animation:nabiz 1.6s infinite}
@keyframes nabiz{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 10px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.oynatici{margin-top:18px;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid #1e2a42;background:#000}
.oynatici iframe{width:100%;height:100%;border:0}
.linkler{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;background:#0f1524;border:1px solid #1a2438;color:#fff;text-decoration:none;font-weight:600;transition:.15s}
.link:hover{border-color:#3b82f6;transform:translateY(-1px);background:#121b2e}
.link svg{flex:none;color:#60a5fa}.link span{flex:1;text-align:left}.link small{color:#9aa6c2;font-weight:500}
.link.ana{background:#3b82f6;border-color:#3b82f6}.link.ana svg,.link.ana small{color:#fff}.link.ana:hover{background:#2563eb}
.bolum{margin-top:34px;width:100%;text-align:left}.bolum h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#9aa6c2;margin-bottom:12px}
.izgara{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kutu{padding:16px;border-radius:14px;background:#0f1524;border:1px solid #1a2438}.kutu b{display:block;font-size:15px}.kutu small{color:#9aa6c2;font-size:13px}
footer{margin-top:auto;padding:30px 0 22px;color:#64748b;font-size:13px;position:relative}
@media(max-width:480px){h1{font-size:34px}.izgara{grid-template-columns:1fr}}
</style></head><body><div class="arka"></div><nav class="ust"><a href="/" class="secili">Ana Sayfa</a><a href="/hakkimda">Hakkımda</a></nav><main>
<img class="logo" id="logo" src="logo.png" alt="Whinsy">
<h1 id="baslik">Whinsy</h1>
<p class="alt" id="alt">Kick yayıncısı<br>Yayınlarda oyun, sohbet ve bol kahkaha. Topluluğa katıl!</p>
<a class="canli" id="canli" href="https://kick.com/whinsyy" target="_blank" rel="noopener"><i></i><span id="canli-yazi">Şu an yayında değil</span></a>
<div class="oynatici" id="oynatici" hidden><iframe src="https://player.kick.com/whinsyy?muted=true&autoplay=true" allowfullscreen allow="autoplay; fullscreen"></iframe></div>
<div class="linkler" id="linkler"><a class="link ana" href="https://kick.com/whinsyy" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="13" rx="2"/><path d="M8 21h8M10 9.5v5l4.5-2.5z"/></svg><span>Kick'te izle</span><small>kick.com/whinsyy</small></a><a class="link" href="https://discord.gg/KE58Dyju7d" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg><span>Discord sunucusu</span><small>Katıl</small></a><a class="link" href="https://instagram.com/erlderin" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5v.01"/></svg><span>Instagram</span><small>@erlderin</small></a><a class="link" href="https://x.com/erlderin" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16M20 4 4 20"/></svg><span>X / Twitter</span><small>@erlderin</small></a></div>
<div class="bolum" id="takvim" hidden></div>
</main><footer id="alt-bilgi">© 2026 Whinsy • Tüm hakları saklıdır.</footer>
<script>
const PANEL = "https://panel.whinsy.com.tr";
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svg = ic => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg>`;
const guvenli = u => /^(https?:|mailto:)/i.test(u || "") ? u : "#";
async function icerik(){
  try{
    const d = await (await fetch(PANEL + "/site/veri", {cache: "no-store"})).json();
    document.title = d.baslik; document.getElementById("baslik").textContent = d.baslik;
    document.getElementById("alt").innerHTML = (d.alt_yazi || "").split("\n").map(esc).join("<br>");
    document.getElementById("linkler").innerHTML = d.linkler.map(l => `<a class="link${l.ana ? " ana" : ""}" href="${esc(guvenli(l.url))}" target="_blank" rel="noopener">${svg(l.ikon_svg)}<span>${esc(l.ad)}</span><small>${esc(l.aciklama)}</small></a>`).join("");
    const t = document.getElementById("takvim");
    const satirlar = (d.takvim || []).filter(x => x.gun);
    if(satirlar.length){ if(!t) return; t.hidden = false; t.innerHTML = `<h2>${esc(d.takvim_baslik)}</h2><div class="izgara">` + satirlar.map(x => `<div class="kutu"><b>${esc(x.gun)}</b><small>${esc(x.saat)}</small></div>`).join("") + "</div>"; }
    else if(t) t.hidden = true;
    document.getElementById("alt-bilgi").textContent = d.alt_bilgi;
    if(d.logo_surum !== "varsayilan") document.getElementById("logo").src = PANEL + "/site/logo?v=" + encodeURIComponent(d.logo_surum);
    document.getElementById("canli").href = "https://kick.com/" + encodeURIComponent(d.kick);
    const o = document.getElementById("oynatici"); if(o){ o.dataset.izin = d.oynatici ? "1" : "0";
      o.querySelector("iframe").src = "https://player.kick.com/" + encodeURIComponent(d.kick) + "?muted=true&autoplay=true"; }
  }catch(e){}
}
async function durum(){
  try{
    const d = await (await fetch(PANEL + "/site/durum", {cache: "no-store"})).json();
    const k = document.getElementById("canli"), y = document.getElementById("canli-yazi"), o = document.getElementById("oynatici");
    k.classList.toggle("acik", !!d.canli);
    y.textContent = d.canli ? "ŞU AN CANLI" + (d.baslik ? " • " + d.baslik : "") : "Şu an yayında değil";
    if(o) o.hidden = !(d.canli && o.dataset.izin !== "0");
  }catch(e){}
}
icerik().then(durum); setInterval(durum, 60000);
</script></body></html>
